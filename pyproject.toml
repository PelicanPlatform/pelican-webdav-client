[build-system]
requires = ["hatchling >=1.27"]
build-backend = "hatchling.build"

[project]
name = "pelican-webdav-client"
version = "0.1.0-rc.0"
description = "A PROPFIND-only asynchronous WebDAV client for the Pelican Platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pelican Platform Developers", email = "info@pelicanplatform.org" }
]
keywords = ["pelican", "webdav", "propfind", "aiohttp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"
dependencies = [
    "aiohttp >=3.12.7,<4",
]

[project.urls]
Source = "https://github.com/PelicanPlatform/pelican-webdav-client"
Pelican-Source = "https://github.com/PelicanPlatform/pelican"
Bug-Reports = "https://github.com/PelicanPlatform/pelican-webdav-client/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[dependency-groups]
testing = [
    "pytest>=9",
    "pytest-httpserver",
    "trustme",
]
dev = [{ include-group = "testing" }]

[tool.uv]
exclude-newer = "3 days"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["test"]

[tool.ruff]
line-length = 200
# A scratch example against a live federation, not part of the package
exclude = ["example_test.py"]
show-fixes = true

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]
ignore = [
    "ANN401",  # The expat callbacks and the error "message" take whatever the caller hands them
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"test/**" = ["ANN", "ARG001", "PLC0415", "T20"]
